<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <!-- Importando Bootstrap 5 para estilização -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-stream {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stream-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #2d2d2d;
        }
        .stream-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .search-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #0dcaf0;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .search-box-container {
            position: relative;
        }
        #gameSearchInput {
            background-color: #2b2b2b;
            color: #fff;
            border: 2px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.95rem;
        }
        #gameSearchInput:focus {
            background-color: #2b2b2b;
            color: #fff;
            border-color: #0dcaf0;
            box-shadow: none;
        }
        #gameSearchInput::placeholder {
            color: #888;
            font-size: 0.85rem;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #2b2b2b;
            border: 1px solid #444;
            border-top: none;
            max-height: 220px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            display: none;
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        .suggestion-item:hover, .suggestion-item.active {
            background-color: #0d6efd;
            color: #fff;
        }
        .copy-feedback {
            font-size: 0.8rem;
            color: #198754;
            text-align: center;
            margin-top: 5px;
            height: 20px;
        }
    </style>
</head>

        <div class="stream-container">
            <iframe src="https://www.youtube.com/embed/_9Ho31qGSqw?autoplay=1&enablejsapi=1"

                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>

        <hr class="border-secondary my-4">

        <!-- SISTEMA DE BUSCA DE JOGOS -->

                <div id="suggestionsList" class="suggestions-list"></div>
            </div>
            <div id="copyFeedback" class="copy-feedback"></div>

            "#jogo {Aladdin (Germany)} snes",
            "#jogo {Aladdin (Japan)} snes",
            "#jogo {Aladdin (Spain)} snes",
            "#jogo {Aladdin (USA)} snes",
            "#jogo {Super Mario World (USA)} snes"
        ];

        const input = document.getElementById('gameSearchInput');
        const listContainer = document.getElementById('suggestionsList');
        const feedback = document.getElementById('copyFeedback');
        
        let currentFocus = -1;

        input.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            listContainer.innerHTML = '';
            currentFocus = -1;

            if (query.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            const matches = rawJogosList.filter(jogo => jogo.toLowerCase().includes(query));

            if (matches.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            matches.forEach((jogo) => {
                const item = document.createElement('div');
                item.classList.add('suggestion-item');
                item.textContent = jogo;
                
                item.addEventListener('click', function() {
                    copiarTexto(jogo);
                });

                listContainer.appendChild(item);
            });

            listContainer.style.display = 'block';
        });

        input.addEventListener('keydown', function(e) {
            const items = listContainer.getElementsByClassName('suggestion-item');
            
            if (e.keyCode == 40) {
                currentFocus++;
                addActive(items);
            } else if (e.keyCode == 38) {
                currentFocus--;
                addActive(items);
            } else if (e.keyCode == 13) {
                e.preventDefault();
                if (currentFocus > -1 && items[currentFocus]) {
                    items[currentFocus].click();
                }
            }
        });

        function addActive(items) {
            if (!items) return false;
            removeActive(items);
            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (items.length - 1);
            items[currentFocus].classList.add('active');
            items[currentFocus].scrollIntoView({ block: 'nearest' });
        }

        function removeActive(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
        }

        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                input.value = texto;
                listContainer.style.display = 'none';
                feedback.textContent = `Copiado com sucesso: ${texto}`;
                setTimeout(() => {
                    feedback.textContent = '';
                }, 3000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target !== input && e.target !== listContainer) {
                listContainer.style.display = 'none';
            }
        });
