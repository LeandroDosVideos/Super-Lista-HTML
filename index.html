<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEANDRODASLIVES SUPER YOUTUBE CHANNEL - SUPER SISTEMA ARVORE RETRO ULTRA TOPZERA</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* Título em Branco, Negrito e Maiúsculo */
        .titulo-canal {
            color: #FFFFFF;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Contentor para colocar o vídeo e o chat lado a lado */
        .container-live {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-container {
            flex: 2;
            min-width: 320px;
            height: 500px;
        }

        .chat-container {
            flex: 1;
            min-width: 300px;
            height: 500px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- TÍTULO DA PÁGINA -->
    <h1 class="titulo-canal">LEANDRODASLIVES SUPER YOUTUBE CHANNEL - SUPER SISTEMA ARVORE RETRO ULTRA TOPZERA</h1>

    <!-- ÁREA DA LIVE E CHAT COM O ID ATUALIZADO -->
    <div class="container-live">
        <!-- VÍDEO DA LIVE -->
        <div class="video-container">
            <iframe 
                src="https://www.youtube.com/embed/_9Ho31qGSqw?autoplay=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- CHAT DA LIVE -->
        <div class="chat-container">
            <iframe 
                src="https://www.youtube.com/live_chat?v=_9Ho31qGSqw&embed_domain=leandrodosvideos.github.io">
            </iframe>
        </div>
    </div>

</body>
</html>
