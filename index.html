        body {

        }
        /* Contorno branco negrito em volta do container principal */
        .container-stream {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px 20px 0px 20px;
            background: #1e1e1e;
            border-radius: 12px;
            border: 8px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        /* Contorno no player de vídeo */
        .stream-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporção 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #2d2d2d;
            border: 8px solid #ffffff;
        }
        .stream-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Contorno no chat oficial do YouTube */
        .chat-container {
            width: 100%;
            height: 300px;
            background: #2d2d2d;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 15px solid #ffffff;
        }
        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Título do sistema de busca em branco negrito destacado */
        .search-title {
            font-size: 1rem;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-shadow: 0 0 5px #ffffff;
        }
        .search-box-container {
            position: relative;
        }
        /* Campo de busca com contorno branco negrito */
        #gameSearchInput {
            background-color: #2b2b2b;
            color: #ffffff;
            font-weight: bold;
            border: 3px solid #ffffff;
            border-radius: 6px;
            padding: 12px;
            font-size: 0.95rem;
        }
        #gameSearchInput:focus {
            background-color: #2b2b2b;
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }
        #gameSearchInput::placeholder {
            color: #dddddd;
            font-weight: bold;
            font-size: 0.85rem;
        }
        /* Lista de sugestões com contorno branco negrito */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 1000;
            background: #111111;
            border: 3px solid #ffffff;
            border-top: none;
            max-height: 220px;
            overflow-y: auto;
            border-radius: 0 0 6px 6px;
            display: none;
        }
        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #444444;
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: bold;
        }
        .suggestion-item:hover, .suggestion-item.active {
            background-color: #0d6efd;
            color: #ffffff;
            font-weight: bold;
        }
        /* Mensagem de confirmação de cópia */
        .copy-feedback {
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
            height: 20px;
            text-shadow: 0 0 5px #ffffff;

            "#jogo {Zoop (Europe)} snes",
            "#jogo {Zoop (USA)} snes",
        ];

        const input = document.getElementById('gameSearchInput');
        const listContainer = document.getElementById('suggestionsList');
        const feedback = document.getElementById('copyFeedback');
        
        let currentFocus = -1;

        input.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            listContainer.innerHTML = '';
            currentFocus = -1;

            if (query.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            const matches = rawJogosList.filter(jogo => jogo.toLowerCase().includes(query));

            if (matches.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            matches.forEach((jogo) => {
                const item = document.createElement('div');
                item.classList.add('suggestion-item');
                item.textContent = jogo;
                
                item.addEventListener('click', function() {
                    copiarTexto(jogo);
                });

                listContainer.appendChild(item);
            });

            listContainer.style.display = 'block';
        });

        input.addEventListener('keydown', function(e) {
            const items = listContainer.getElementsByClassName('suggestion-item');
            
            if (e.keyCode == 40) {
                currentFocus++;
                addActive(items);
            } else if (e.keyCode == 38) {
                currentFocus--;
                addActive(items);
            } else if (e.keyCode == 13) {
                e.preventDefault();
                if (currentFocus > -1 && items[currentFocus]) {
                    items[currentFocus].click();
                }
            }
        });

        function addActive(items) {
            if (!items) return false;
            removeActive(items);
            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (items.length - 1);
            items[currentFocus].classList.add('active');
            items[currentFocus].scrollIntoView({ block: 'nearest' });
        }

        function removeActive(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active');
            }
        }

        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                input.value = texto;
                listContainer.style.display = 'none';
                feedback.textContent = `Copiado com sucesso: ${texto}`;
                setTimeout(() => {
                    feedback.textContent = '';
                }, 3000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target !== input && e.target !== listContainer) {
                listContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
